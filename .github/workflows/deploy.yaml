
name: React.js CI/CD - EC2 Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests, if configured
      # - name: Run testsfc
      #   run: npm test --if-present


      - name: Validate SSH secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Checking SSH key format..."

          head -n 1 /tmp/deploy_key
          tail -n 1 /tmp/deploy_key

          if ssh-keygen -y -f /tmp/deploy_key > /dev/null 2>&1; then
            echo "SSH key is valid and readable."
          else
            echo "SSH key is INVALID or unreadable."
            exit 1
          fi

          rm -f /tmp/deploy_key

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/ubuntu/devTinder-web

            node -v
            npm -v
            pm2 -v

            git fetch origin main
            git reset --hard origin/main

            npm run build

            sudo scp -r dist/* /var/www/html/

            sudo systemctl reload nginx

            npm ci --omit=dev


